jacoco {
    toolVersion = '0.8.15'
}

def coverageExcludes = ['**/WeiterApplication.class', '**/WeiterApplication$*.class']
def coveredClasses = files(sourceSets.main.output.classesDirs.collect {
    fileTree(dir: it, exclude: coverageExcludes)
})

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
    }
    classDirectories.setFrom(coveredClasses)
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn jacocoTestReport
    classDirectories.setFrom(coveredClasses)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}
