name: Java CI and PIT

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew check bootJar

      - name: Check mutations in changed Java classes
        if: github.event_name == 'pull_request'
        env:
          PITEST_BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: ./gradlew pitest -PpitestChanged=true -PpitestBaseRef="$PITEST_BASE_REF"

      - name: Upload test, JaCoCo and PIT reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
            build/reports/pitest
          if-no-files-found: ignore
